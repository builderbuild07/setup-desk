# Netlify settings. You shouldn't need to change these.
[build]
  publish = "site"
  command = "node scripts/build.mjs"

[build.environment]
  NODE_VERSION = "22"

# Settings file: always fetch the latest so changes show up straight away.
[[headers]]
  for = "/site-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# setupdesk.online is a domain alias: send every visitor to the same page on setupdesk.com.au.
# (www.setupdesk.com.au -> setupdesk.com.au is automatic, because it's the primary domain.)
[[redirects]]
  from = "https://setupdesk.online/*"
  to = "https://setupdesk.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://setupdesk.online/*"
  to = "https://setupdesk.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.setupdesk.online/*"
  to = "https://setupdesk.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.setupdesk.online/*"
  to = "https://setupdesk.com.au/:splat"
  status = 301
  force = true
